<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Inspired by GitBanner (https://github.com/Saviru/GitBanner, MIT License) -->
  <defs>
    <radialGradient id="redGlow" cx="0.1" cy="0.1" r="1.6">
      <stop offset="0%" stop-color="#520806" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#520806" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      <animate attributeName="cx" values="0.1;0.5;0.9;0.5;0.1" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0.1;0.6;0.9;0.4;0.1" dur="24s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.9" cy="0.9" r="1.4">
      <stop offset="0%" stop-color="#021D4A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#021D4A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      <animate attributeName="cx" values="0.9;0.5;0.1;0.5;0.9" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0.9;0.4;0.1;0.6;0.9" dur="26s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#d0d0d0"/>
      <stop offset="55%" stop-color="#8a8a8a"/><stop offset="75%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.47" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="0.53" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="r"><rect width="800" height="200" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Fira Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace}
    .sans{font-family:'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif;font-weight:800}
  </style>
  <g clip-path="url(#r)">
    <rect width="800" height="200" fill="#0b0b0f"/>
    <rect width="800" height="200" fill="url(#redGlow)"/>
    <rect width="800" height="200" fill="url(#blueGlow)"/>
    <rect width="800" height="200" fill="url(#grid)"/>

    <!-- Slide 1: terminal (0-4s of 12s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.31;0.333;0.98;1" dur="12s" repeatCount="indefinite"/>
      <circle cx="30" cy="26" r="6" fill="#ff5f56"/><circle cx="50" cy="26" r="6" fill="#ffbd2e"/><circle cx="70" cy="26" r="6" fill="#27c93f"/>
      <text x="400" y="30" class="mono" font-size="12" fill="#666" text-anchor="middle">jpdev - zsh</text>
      <text x="40" y="70" class="mono" font-size="18" fill="#27c93f">Joao-Pedro-AI-Visionary:~$ <tspan fill="#eee">init --stack</tspan></text>
      <g class="mono" font-size="14">
        <text x="40" y="100" fill="#7aa2f7" opacity="0">[ok] TypeScript · Node.js · Next.js · Vue.js · Laravel · Python<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.07;1" dur="12s" repeatCount="indefinite"/></text>
        <text x="40" y="124" fill="#bb9af7" opacity="0">[ok] PostgreSQL · Docker · AWS<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.11;0.12;1" dur="12s" repeatCount="indefinite"/></text>
        <text x="40" y="148" fill="#e0af68" opacity="0">[ok] AI Agents · MCP · RAG · Claude Code · Cursor<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.17;1" dur="12s" repeatCount="indefinite"/></text>
      </g>
      <rect x="40" y="160" width="0" height="8" rx="4" fill="#27c93f">
        <animate attributeName="width" values="0;0;600;600" keyTimes="0;0.05;0.27;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="160" width="600" height="8" rx="4" fill="none" stroke="#333"/>
      <text x="660" y="168" class="mono" font-size="12" fill="#27c93f" opacity="0">ready<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.28;1" dur="12s" repeatCount="indefinite"/></text>
    </g>

    <!-- Slide 2: RGB glitch (4-8s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.35;0.646;0.666;1" dur="12s" repeatCount="indefinite"/>
      <g class="sans" font-size="44" text-anchor="middle">
        <text x="400" y="105" fill="#ff003c" opacity="0.8">João Pedro Teixeira Rocha<animate attributeName="x" values="400;396;403;400;398;400" dur="0.6s" repeatCount="indefinite"/></text>
        <text x="400" y="105" fill="#00e5ff" opacity="0.8">João Pedro Teixeira Rocha<animate attributeName="x" values="400;404;397;400;402;400" dur="0.5s" repeatCount="indefinite"/></text>
        <text x="400" y="105" fill="#ffffff">João Pedro Teixeira Rocha</text>
      </g>
      <text x="400" y="150" class="mono" font-size="22" fill="#00e5ff" text-anchor="middle" letter-spacing="6">&lt;JpDev /&gt;</text>
      <rect x="0" y="80" width="800" height="3" fill="#fff" opacity="0.15">
        <animate attributeName="y" values="20;180;20" dur="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Slide 3: metallic (8-12s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.69;0.98;1" dur="12s" repeatCount="indefinite"/>
      <text x="400" y="100" class="sans" font-size="50" fill="url(#metal)" stroke="#444" stroke-width="0.6" text-anchor="middle">Full Stack + AI Engineer</text>
      <text x="400" y="100" class="sans" font-size="50" fill="url(#shine)" text-anchor="middle">Full Stack + AI Engineer</text>
      <text x="400" y="145" class="mono" font-size="15" fill="#aaa" text-anchor="middle">AI Agents · MCP · RAG · Lima Neto · Mentor @ Vibe Code</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="199" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
